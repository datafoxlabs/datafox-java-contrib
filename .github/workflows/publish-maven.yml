name: Publish DataFox Java Contrib to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Validate version and branch
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          [[ "$VERSION" != *-SNAPSHOT ]]
      - name: Verify build and Maven artifacts
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew spotlessCheck build \
            :kafka-exporter:publishToMavenLocal \
            :uuid-propagator:publishToMavenLocal \
            -PreleaseVersion="$VERSION" --no-daemon
          for module in kafka-exporter uuid-propagator; do
            artifact="datafox-$module"
            dir="$HOME/.m2/repository/com/datafox/$artifact/$VERSION"
            for suffix in .jar -sources.jar -javadoc.jar .pom; do
              test -s "$dir/$artifact-$VERSION$suffix"
            done
            ! grep -q -- '-SNAPSHOT' "$dir/$artifact-$VERSION.pom"
          done
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          ./gradlew :kafka-exporter:publishMavenPublicationToGitHubPackagesRepository \
            :uuid-propagator:publishMavenPublicationToGitHubPackagesRepository \
            -PreleaseVersion="$VERSION" --no-daemon --stacktrace
