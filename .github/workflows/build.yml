name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      # Until wrapper JAR is added, bootstrap from the verified upstream distribution.
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.8.1 --distribution-type bin
      - name: Verify Gradle Wrapper distribution checksum
        run: grep -F 'distributionSha256Sum=dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f' gradle/wrapper/gradle-wrapper.properties
      - name: Spotless
        run: bash ./gradlew spotlessCheck
      - name: Build
        run: bash ./gradlew build
