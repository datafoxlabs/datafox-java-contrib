name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Spotless
        run: ./gradlew spotlessCheck
      - name: Build and test
        run: ./gradlew build
      - name: Kafka exporter on Java 8
        run: ./gradlew :kafka-exporter:test -PtestJavaVersion=8
      - name: Verify Maven release artifacts
        run: |
          set -euo pipefail
          VERSION=0.1.0-alpha.1
          ./gradlew :kafka-exporter:publishToMavenLocal :uuid-propagator:publishToMavenLocal -PreleaseVersion="$VERSION"
          for module in kafka-exporter uuid-propagator; do
            artifact="datafox-$module"
            dir="$HOME/.m2/repository/com/datafox/$artifact/$VERSION"
            test -s "$dir/$artifact-$VERSION.jar"
            test -s "$dir/$artifact-$VERSION-sources.jar"
            test -s "$dir/$artifact-$VERSION-javadoc.jar"
            test -s "$dir/$artifact-$VERSION.pom"
            if grep -q -- '-SNAPSHOT' "$dir/$artifact-$VERSION.pom"; then
              echo "SNAPSHOT dependency in release POM: $artifact" >&2
              exit 1
            fi
          done
