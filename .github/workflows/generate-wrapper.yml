name: Generate Gradle Wrapper JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Generate official wrapper
        run: |
          if git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Wrapper JAR is already tracked."
            exit 0
          fi
          gradle wrapper --gradle-version 9.8.1 --distribution-type bin
      - name: Commit generated wrapper JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "Gradle wrapper JAR is already tracked."
            exit 0
          fi
          git commit -m "build: add Gradle 9.8.1 wrapper JAR"
          git push origin HEAD:main
