name: Generate Gradle Wrapper JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: datafox-gradle-wrapper-bootstrap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Generate official wrapper
        run: |
          if git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Wrapper JAR is already tracked."
            exit 0
          fi
          gradle wrapper --gradle-version 9.8.1 --distribution-type bin
      - name: Commit generated wrapper JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "Gradle wrapper JAR is already tracked."
            exit 0
          fi
          git commit -m "build: add Gradle 9.8.1 wrapper JAR"
          git fetch origin main
          if git cat-file -e origin/main:gradle/wrapper/gradle-wrapper.jar 2>/dev/null; then
            echo "Wrapper JAR was committed by another build."
            exit 0
          fi
          # Gradle may rewrite the checked-in scripts/properties. Only the JAR belongs in this commit.
          git restore -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties
          git rebase origin/main
          git push origin HEAD:main
